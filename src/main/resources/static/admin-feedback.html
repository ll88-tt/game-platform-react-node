<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反馈管理 · GAMEVILA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0e14;
            color: #edf2f7;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 32px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-item {
            background: #161e2a;
            border: 1px solid #2a3748;
            padding: 16px 24px;
            border-radius: 12px;
            flex: 1;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #a78bfa;
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .filter-btn {
            padding: 10px 20px;
            background: #161e2a;
            border: 1px solid #2a3748;
            border-radius: 8px;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: #a78bfa;
        }

        .filter-btn.active {
            background: #7c3aed;
            border-color: #7c3aed;
            color: white;
        }

        .feedback-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .feedback-card {
            background: #161e2a;
            border: 1px solid #2a3748;
            border-radius: 16px;
            padding: 24px;
            transition: all 0.2s;
        }

        .feedback-card:hover {
            border-color: #7c3aed60;
        }

        .feedback-card.resolved {
            opacity: 0.6;
        }

        .feedback-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .feedback-type {
            display: inline-block;
            padding: 6px 12px;
            background: #7c3aed;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .feedback-time {
            color: #64748b;
            font-size: 0.9rem;
        }

        .feedback-body {
            margin-bottom: 16px;
        }

        .feedback-user {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .feedback-desc {
            color: #edf2f7;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .feedback-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid #2a3748;
        }

        .feedback-browser {
            color: #64748b;
            font-size: 0.85rem;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .resolve-btn {
            background: #10b981;
            color: white;
        }

        .resolve-btn:hover {
            background: #059669;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .refresh-btn {
            padding: 12px 24px;
            background: #7c3aed;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: #8b5cf6;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><i class="fas fa-gamepad"></i> GAMEVILA 管理后台</div>
        <button class="refresh-btn" onclick="loadFeedbacks()">
            <i class="fas fa-sync-alt"></i> 刷新
        </button>
    </div>

    <h1 class="page-title"><i class="fas fa-inbox"></i> 用户反馈管理</h1>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-label">总反馈数</div>
            <div class="stat-value" id="totalCount">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">待处理</div>
            <div class="stat-value" id="pendingCount" style="color: #f59e0b;">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">已解决</div>
            <div class="stat-value" id="resolvedCount" style="color: #10b981;">0</div>
        </div>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterFeedbacks('all')">全部</button>
        <button class="filter-btn" onclick="filterFeedbacks('pending')">待处理</button>
        <button class="filter-btn" onclick="filterFeedbacks('resolved')">已解决</button>
    </div>

    <div class="feedback-list" id="feedbackList">
        <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <p>加载中...</p>
        </div>
    </div>
</div>

<script>    let allFeedbacks = [];
let currentFilter = 'all';

const typeMap = {
    'login': '登录/注册问题',
    'payment': '支付/订阅问题',
    'game': '游戏加载问题',
    'search': '搜索功能问题',
    'ui': '界面显示问题',
    'performance': '性能问题',
    'bug': '程序错误',
    'suggestion': '功能建议',
    'other': '其他问题'
};

async function loadFeedbacks() {
    try {
        const response = await fetch('/api/feedback');

        if (response.status === 403) {
            alert('无权访问：仅管理员可访问此页面');
            window.location.href = 'home.html';
            return;
        }

        if (!response.ok) {
            throw new Error('HTTP error! status: ' + response.status);
        }

        allFeedbacks = await response.json();
        renderFeedbacks();
        updateStats();
    } catch (error) {
        console.error('加载反馈失败:', error);
        document.getElementById('feedbackList').innerHTML = `                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>加载失败，请刷新重试</p>
                    </div>
                `;
    }
}


    function renderFeedbacks() {
        const list = document.getElementById('feedbackList');

        let filtered = allFeedbacks;
        if (currentFilter === 'pending') {
            filtered = allFeedbacks.filter(f => !f.isResolved);
        } else if (currentFilter === 'resolved') {
            filtered = allFeedbacks.filter(f => f.isResolved);
        }

        if (filtered.length === 0) {
            list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>暂无反馈数据</p>
                    </div>
                `;
            return;
        }

        list.innerHTML = filtered.map(feedback => `
                <div class="feedback-card ${feedback.isResolved ? 'resolved' : ''}">
                    <div class="feedback-header">
                        <span class="feedback-type">${typeMap[feedback.problemType] || feedback.problemType}</span>
                        <span class="feedback-time">${new Date(feedback.createTime).toLocaleString('zh-CN')}</span>
                    </div>
                    <div class="feedback-body">
                        ${feedback.userName ? `<div class="feedback-user"><i class="fas fa-user"></i> ${feedback.userName} ${feedback.userEmail ? `(${feedback.userEmail})` : ''}</div>` : ''}
                        <div class="feedback-desc">${feedback.problemDesc}</div>
                    </div>
                    <div class="feedback-footer">
                        <span class="feedback-browser"><i class="fas fa-laptop"></i> ${feedback.browserInfo || '未提供'}</span>
                        <div class="action-btns">
                            ${!feedback.isResolved ? `<button class="action-btn resolve-btn" onclick="markResolved(${feedback.id})"><i class="fas fa-check"></i> 标记解决</button>` : ''}
                            <button class="action-btn delete-btn" onclick="deleteFeedback(${feedback.id})"><i class="fas fa-trash"></i> 删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
    }

    function updateStats() {
        const total = allFeedbacks.length;
        const resolved = allFeedbacks.filter(f => f.isResolved).length;
        const pending = total - resolved;

        document.getElementById('totalCount').textContent = total;
        document.getElementById('pendingCount').textContent = pending;
        document.getElementById('resolvedCount').textContent = resolved;
    }

    function filterFeedbacks(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderFeedbacks();
    }

async function markResolved(id) {
    if (!confirm('确定标记为已解决？')) return;

    try {
        const response = await fetch(`/api/feedback/${id}/resolve`, {
            method: 'PUT'
        });

        if (response.status === 403) {
            alert('无权操作');
            return;
        }

        const result = await response.json();

        if (result.success) {
            loadFeedbacks();
        }
    } catch (error) {
        alert('操作失败');
    }
}

async function deleteFeedback(id) {
    if (!confirm('确定删除此反馈？此操作不可恢复！')) return;

    try {
        const response = await fetch(`/api/feedback/${id}`, {
            method: 'DELETE'
        });

        if (response.status === 403) {
            alert('无权操作');
            return;
        }

        const result = await response.json();

        if (result.success) {
            loadFeedbacks();
        }
    } catch (error) {
        alert('删除失败');
    }
}

loadFeedbacks();
</script>

</body>
</html>

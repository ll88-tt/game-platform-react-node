<!DOCTYPE html>
<html lang="zh">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>游戏大厅 · 玩家空间</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0e14;
            color: #edf2f7;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: #cbd5e1;
            font-weight: 500;
            transition: color 0.2s;
            font-size: 1rem;
        }

        .nav-links a:hover {
            color: #a78bfa;
        }

        .buy-now {
            background: linear-gradient(145deg, #7c3aed, #a855f7);
            padding: 8px 18px;
            border-radius: 40px;
            color: white !important;
            font-weight: 600;
            box-shadow: 0 6px 14px rgba(124, 58, 237, 0.3);
            transition: all 0.2s;
        }

        .buy-now:hover {
            background: #8b5cf6;
            transform: scale(1.02);
            box-shadow: 0 8px 18px rgba(139, 92, 246, 0.4);
        }

        .avatar-wrapper {
            position: relative;
        }

        .avatar-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px 4px 12px;
            border-radius: 40px;
            background: #1e2632;
            transition: background 0.2s;
            color: #e2e8f0;
            font-weight: 500;
        }

        .avatar-btn:hover {
            background: #2d3748;
        }

        .avatar-icon {
            font-size: 2rem;
            color: #94a3b8;
        }

        .avatar-text {
            font-size: 0.9rem;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #1e2632;
            border-radius: 18px;
            padding: 8px 0;
            min-width: 200px;
            box-shadow: 0 20px 30px -8px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.2s, transform 0.2s;
        }

        .dropdown-menu.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .dropdown-item {
            padding: 10px 18px;
            color: #e2e8f0;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.15s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }

        .dropdown-item i {
            width: 20px;
            color: #a78bfa;
        }

        .dropdown-item:hover {
            background: #2d3a4a;
        }

        .divider {
            height: 1px;
            background: rgba(255,255,255,0.08);
            margin: 6px 0;
        }

        .user-info {
            padding: 10px 18px;
            color: #b9c7da;
            font-size: 0.85rem;
            border-bottom: 1px solid #2d3748;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 48px 0 32px;
            flex-wrap: wrap;
            gap: 30px;
        }

        .hero-content {
            flex: 1 1 400px;
        }

        .hero-badge {
            color: #c084fc;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .hero-title {
            font-size: 3.8rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero-title span {
            background: linear-gradient(135deg, #d8b4fe, #f9a8d4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero-desc {
            color: #9ca3af;
            font-size: 1.1rem;
            max-width: 500px;
            margin-bottom: 32px;
        }

        .search-container {
            margin-bottom: 24px;
            max-width: 500px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            background: #161e2a;
            border: 1px solid #2a3748;
            border-radius: 16px;
            color: #edf2f7;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.1);
        }

        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #1e2632;
            border: 1px solid #2d3f54;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 100;
            display: none;
            overflow: hidden;
        }

        .autocomplete-dropdown.show {
            display: block;
        }

        .autocomplete-item {
            padding: 12px 20px;
            cursor: pointer;
            color: #cbd5e1;
            font-size: 0.95rem;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .autocomplete-item:hover {
            background: #2d3a4a;
        }

        .autocomplete-item i {
            color: #a78bfa;
            font-size: 0.9rem;
        }

        .autocomplete-item .highlight {
            color: #c084fc;
            font-weight: 600;
        }

        .search-icon {

        position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1.1rem;
        }

        .btn-discover {
            background: white;
            color: #0f172a;
            border: none;
            padding: 14px 34px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 12px 18px -8px rgba(0,0,0,0.4);
            transition: all 0.25s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-discover i {
            transition: transform 0.2s;
        }

        .btn-discover:hover {
            background: #f1f5f9;
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -8px #a78bfa50;
        }

        .btn-discover:hover i {
            transform: translateX(5px);
        }

        .hero-visual {
            flex: 1 1 300px;
            background: radial-gradient(circle at 30% 30%, #2a1e3c, #0f1119);
            border-radius: 32px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 220px;
            border: 1px solid #2e3a4e;
        }

        .hero-visual i {
            font-size: 8rem;
            color: #a78bfa;
            opacity: 0.8;
            filter: drop-shadow(0 0 20px #c084fc);
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 40px 0 20px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .category-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .category-tab {
            padding: 10px 20px;
            background: #161e2a;
            border: 1px solid #2a3748;
            border-radius: 40px;
            color: #cbd5e1;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .category-tab:hover {
            background: #1e293b;
            border-color: #7c3aed;
        }

        .category-tab.active {
            background: linear-gradient(145deg, #7c3aed, #a855f7);
            border-color: #7c3aed;
            color: white;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 48px;
        }

        .game-card {
            background: #161e2a;
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.25s;
            border: 1px solid #2a3748;
            cursor: pointer;
            box-shadow: 0 8px 0 #0b1017;
        }

        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 0 #0b1017, 0 10px 25px -5px #00000080;
            border-color: #7c3aed60;
        }

        .game-img {
            aspect-ratio: 16/10;
            background: #1e2a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 2.8rem;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .img-placeholder {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-info {
            padding: 16px 14px 18px;
        }

        .game-title {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .game-tag {
            color: #94a3b8;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .game-tag i {
            color: #a78bfa;
        }

        .history-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 360px;
            height: 100vh;
            background: #121a24;
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.7);
            z-index: 2000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #2d3f54;
        }

        .history-panel.open {
            transform: translateX(0);
        }

        .panel-header {
            padding: 24px 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #283340;
        }

        .panel-header h3 {
            font-weight: 600;
            font-size: 1.4rem;
            display: flex;
            gap: 8px;
        }

        .close-panel {
            background: none;
            border: none;
            color: #9ab3d0;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
        }

        .history-item {
            padding: 14px 16px;
            background: #1b2633;
            margin-bottom: 8px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #314a60;
        }

        .history-icon {
            background: #2d3f54;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .history-detail {
            flex: 1;
        }

        .history-game {
            font-weight: 600;
        }

        .history-time {
            font-size: 0.75rem;
            color: #8ca3b9;
        }

        .clear-history {
            margin: 16px 20px 24px;
            background: #2a3a4a;
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: #e2e8f0;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
        }

        .clear-history:hover {
            background: #3f5168;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: #00000070;
            backdrop-filter: blur(3px);
            z-index: 1500;
            display: none;
        }

        .overlay.show {
            display: block;
        }

        .login-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: #1e2632;
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            z-index: 3000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            border: 1px solid #2d3f54;
        }

        .login-modal.show {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .login-modal h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #edf2f7;
            font-size: 1.8rem;
        }

        .login-form-group {
            margin-bottom: 20px;
        }

        .login-form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 500;
        }

        .login-form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0b0e14;
            border: 1px solid #2d3f54;
            border-radius: 12px;
            color: #edf2f7;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .login-form-group input:focus {
            outline: none;
            border-color: #a78bfa;
        }

        .login-submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(145deg, #7c3aed, #a855f7);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .login-submit-btn:hover {
            background: linear-gradient(145deg, #6d28d9, #9333ea);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(124, 58, 237, 0.4);
        }

        .login-submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-error {
            color: #f87171;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .close-login-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }

        .close-login-modal:hover {
            color: #edf2f7;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .register-link a {
            color: #a78bfa;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .register-link a:hover {
            color: #c084fc;
            text-decoration: underline;
        }

        .login-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #64748b;
            font-size: 0.85rem;
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #2d3f54;
        }

        .login-divider span {
            padding: 0 10px;
        }

        .register-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: #1e2632;
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            z-index: 3000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            border: 1px solid #2d3f54;
        }

        .register-modal.show {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .register-modal h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #edf2f7;
            font-size: 1.8rem;
        }

        .register-form-group {
            margin-bottom: 20px;
        }

        .register-form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 500;
        }

        .register-form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0b0e14;
            border: 1px solid #2d3f54;
            border-radius: 12px;
            color: #edf2f7;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .register-form-group input:focus {
            outline: none;
            border-color: #a78bfa;
        }

        .register-submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(145deg, #7c3aed, #a855f7);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .register-submit-btn:hover {
            background: linear-gradient(145deg, #6d28d9, #9333ea);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(124, 58, 237, 0.4);
        }

        .register-submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .register-error {
            color: #f87171;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .register-success {
            color: #34d399;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .close-register-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }

        .close-register-modal:hover {
            color: #edf2f7;
        }

        .footer {
            margin-top: auto;
            padding: 24px 0;
            text-align: center;
            color: #6b7b8f;
            border-top: 1px solid #1e2a36;
        }

        .flex {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        button {
            font-family: inherit;
        }

        a {
            text-decoration: none;
        }

        @media (max-width: 700px) {
            .nav-links {
                gap: 16px;
                margin-top: 12px;
                width: 100%;
                justify-content: center;
            }
            .header {
                justify-content: center;
            }
            .hero-title {
                font-size: 2.8rem;
            }
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="history-panel" id="historyPanel">
    <div class="panel-header">
        <h3><i class="fas fa-history" style="color:#a78bfa;"></i> 浏览足迹</h3>
        <button class="close-panel" id="closeHistoryPanel"><i class="fas fa-times"></i></button>
    </div>
    <div class="history-list" id="historyListContainer">
    </div>
    <button class="clear-history" id="clearHistoryBtn"><i class="fas fa-trash-alt"></i> 清空记录</button>
</div>

<div class="login-modal" id="loginModal">
    <button class="close-login-modal" id="closeLoginModal"><i class="fas fa-times"></i></button>
    <h2><i class="fas fa-sign-in-alt" style="color: #a78bfa; margin-right: 10px;"></i>用户登录</h2>
    <form id="loginForm">
        <div class="login-form-group">
            <label for="loginUsername"><i class="fas fa-user"></i> 用户名</label>
            <input type="text" id="loginUsername" name="username" required autocomplete="username">
        </div>
        <div class="login-form-group">
            <label for="loginPassword"><i class="fas fa-lock"></i> 密码</label>
            <input type="password" id="loginPassword" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="login-submit-btn" id="loginSubmitBtn">
            <i class="fas fa-spinner fa-spin" style="display: none;" id="loginSpinner"></i>
            <span id="loginBtnText">登录</span>
        </button>
        <div class="login-error" id="loginError"></div>
        <div class="login-divider"><span>或</span></div>
        <div class="register-link">
            还没有账号？<a id="showRegisterFromLogin">立即注册</a>
        </div>
    </form>
</div>

<div class="register-modal" id="registerModal">
    <button class="close-register-modal" id="closeRegisterModal"><i class="fas fa-times"></i></button>
    <h2><i class="fas fa-user-plus" style="color: #a78bfa; margin-right: 10px;"></i>用户注册</h2>
    <form id="registerForm">
        <div class="register-form-group">
            <label for="registerUsername"><i class="fas fa-user"></i> 用户名</label>
            <input type="text" id="registerUsername" name="username" required autocomplete="username" minlength="3" maxlength="20">
        </div>
        <div class="register-form-group">
            <label for="registerEmail"><i class="fas fa-envelope"></i> 邮箱（可选）</label>
            <input type="email" id="registerEmail" name="email" autocomplete="email">
        </div>
        <div class="register-form-group">
            <label for="registerPassword"><i class="fas fa-lock"></i> 密码</label>
            <input type="password" id="registerPassword" name="password" required autocomplete="new-password" minlength="6">
        </div>
        <div class="register-form-group">

<script>
    (function(){
        "use strict";

        const grid = document.getElementById('gameGrid');
        const searchInput = document.getElementById('gameSearchInput');
        const autocompleteDropdown = document.getElementById('autocompleteDropdown');
        const categoryTabs = document.getElementById('categoryTabs');
        let allGamesData = [];
        let currentCategory = 'all';
        let autocompleteTimeout;

        async function loadGamesFromDatabase() {
            try {
                const response = await fetch('/api/games', {
                    method: 'GET',
                    credentials: 'same-origin'
                });
                if (response.ok) {
                    allGamesData = await response.json();
                    console.log('加载的游戏数据:', allGamesData);
                    console.log('分类统计:', getCategoryStats(allGamesData));
                    renderGamesFromDatabase(allGamesData);
                } else {
                    console.warn('加载游戏数据失败，状态码:', response.status);
                }
            } catch (error) {
                console.error('加载游戏数据失败:', error);
            }
        }

        function getCategoryStats(games) {
            const stats = {};
            games.forEach(game => {
                const cat = game.category || '未分类';
                stats[cat] = (stats[cat] || 0) + 1;
            });
            return stats;
        }

        function renderGamesFromDatabase(games) {
            let html = '';
            if (games.length === 0) {
                html = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;">未找到相关游戏</div>';
            } else {
                games.forEach((game, idx) => {
                    const imgHtml = game.imageUrl
                        ? `<img src="${game.imageUrl}" alt="${game.name}" class="img-placeholder">`
                        : `<i class="fas fa-gamepad" style="font-size: 3.5rem; color: #e2e8f0; opacity: 0.9;"></i>`;

                    const displayDesc = game.description || '暂无简介';

                    html += `
                        <div class="game-card" data-game-name="${game.name}" data-game-id="${game.id}" data-game-link="${game.link || '#'}">
                            <div class="game-img" style="background: ${game.imageUrl ? '#1e2a3a' : '#3b2e5c'};">
                                ${imgHtml}
                            </div>
                            <div class="game-info">
                                <div class="game-title">${game.name}</div>
                                <div class="game-tag"><i class="fas fa-tag"></i> ${displayDesc}</div>
                            </div>
                        </div>
                    `;
                });
            }
            grid.innerHTML = html;
        }

        async function filterByCategory(category) {
            currentCategory = category;

            if (category === 'all') {
                renderGamesFromDatabase(allGamesData);
            } else {
                try {
                    console.log(`正在获取分类 "${category}" 的游戏...`);

                    const response = await fetch(`/api/games/category/${encodeURIComponent(category)}`, {
                        method: 'GET',
                        credentials: 'same-origin'
                    });

                    if (response.ok) {
                        const filtered = await response.json();
                        console.log(`分类 "${category}" 的游戏数量:`, filtered.length);
                        renderGamesFromDatabase(filtered);
                    } else {
                        console.error('获取分类游戏失败:', response.status);
                        renderGamesFromDatabase([]);
                    }
                } catch (error) {
                    console.error('获取分类游戏错误:', error);
                    renderGamesFromDatabase([]);
                }
            }
        }

        async function searchGames(searchTerm) {
            if (!searchTerm || searchTerm.trim() === '') {
                filterByCategory(currentCategory);
                hideAutocomplete();
                return;
            }

            try {
                console.log(`正在搜索: "${searchTerm}"`);

                const response = await fetch(`/api/games/search?name=${encodeURIComponent(searchTerm)}`, {
                    method: 'GET',
                    credentials: 'same-origin'
                });
                if (response.ok) {
                    const results = await response.json();
                    console.log(`搜索结果: ${results.length} 个游戏`);
                    renderGamesFromDatabase(results);
                } else {
                    console.error('搜索失败:', response.status);
                }
            } catch (error) {
                console.error('搜索游戏失败:', error);
            }
        }

        async function fetchAutocompleteSuggestions(prefix) {
            if (!prefix || prefix.trim().length === 0) {
                hideAutocomplete();
                return;
            }

            try {
                const response = await fetch(`/api/games/autocomplete?prefix=${encodeURIComponent(prefix)}`, {
                    method: 'GET',
                    credentials: 'same-origin'
                });

                if (response.ok) {
                    const suggestions = await response.json();
                    showAutocomplete(suggestions, prefix);
                }
            } catch (error) {
                console.error('获取自动补全建议失败:', error);
            }
        }

        function showAutocomplete(suggestions, prefix) {
            if (!suggestions || suggestions.length === 0) {
                hideAutocomplete();
                return;
            }

            let html = '';
            suggestions.forEach((suggestion, index) => {
                const highlightedText = highlightMatch(suggestion, prefix);
                html += `
                    <div class="autocomplete-item" data-suggestion="${suggestion}">
                        <i class="fas fa-search"></i>
                        <span>${highlightedText}</span>
                    </div>
                `;
            });

            autocompleteDropdown.innerHTML = html;
            autocompleteDropdown.classList.add('show');
        }

        function highlightMatch(text, prefix) {
            const regex = new RegExp(`(${escapeRegex(prefix)})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function hideAutocomplete() {
            autocompleteDropdown.classList.remove('show');
        }

        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            clearTimeout(autocompleteTimeout);
            const searchTerm = e.target.value.trim();

            autocompleteTimeout = setTimeout(() => {
                fetchAutocompleteSuggestions(searchTerm);
            }, 200);

            searchTimeout = setTimeout(() => {
                searchGames(searchTerm);
            }, 300);
        });

        searchInput.addEventListener('focus', () => {
            const searchTerm = searchInput.value.trim();
            if (searchTerm.length > 0) {
                fetchAutocompleteSuggestions(searchTerm);
            }
        });

        searchInput.addEventListener('blur', () => {
            setTimeout(() => {
                hideAutocomplete();
            }, 200);
        });

        autocompleteDropdown.addEventListener('click', (e) => {
            const item = e.target.closest('.autocomplete-item');
            if (!item) return;

            const suggestion = item.dataset.suggestion;
            searchInput.value = suggestion;
            hideAutocomplete();
            searchGames(suggestion);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideAutocomplete();
            }
        });

        categoryTabs.addEventListener('click', (e) => {
            const tab = e.target.closest('.category-tab');
            if (!tab) return;

            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));

            const category = tab.dataset.category;
            filterByCategory(category);
        });

                            setTimeout(() => {
                                window.location.href = gameLink;

                    } else {
                        showTemporaryMessage(`权限不足: ${data.message}`);
                        if (confirm(`${data.message}\n\n是否前往订阅页面？`)) {
                            window.location.href = 'service.html';
                        }
                    }
                } catch (error) {
                    console.error('检查权限失败:', error);
                    addHistory(gameName);
                    if (gameLink && gameLink !== '#') {
                        window.location.href = gameLink;
                    }
                }
            }
        });

        loadGamesFromDatabase();

        let isLoggedIn = false;
        let currentUser = null;
        let currentPermissionLevel = 'FREE';
        let currentPermissionExpiry = null;
        let isAdmin = false;

        let historyRecords = [];
        const MAX_HISTORY = 20;

        const avatarBtn = document.getElementById('avatarBtn');
        const avatarStatus = document.getElementById('avatarStatus');
        const avatarIcon = document.getElementById('avatarIcon');
        const dropdown = document.getElementById('userDropdown');
        const dropdownContent = document.getElementById('dropdownContent');
        const overlay = document.getElementById('overlay');
        const historyPanel = document.getElementById('historyPanel');
        const closeHistoryBtn = document.getElementById('closeHistoryPanel');
        const historyContainer = document.getElementById('historyListContainer');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const discoverBtn = document.getElementById('discoverBtn');
        const avatarWrapper = document.getElementById('avatarWrapper');

        const loginModal = document.getElementById('loginModal');
        const closeLoginModalBtn = document.getElementById('closeLoginModal');
        const loginForm = document.getElementById('loginForm');
        const loginUsernameInput = document.getElementById('loginUsername');
        const loginPasswordInput = document.getElementById('loginPassword');
        const loginSubmitBtn = document.getElementById('loginSubmitBtn');
        const loginSpinner = document.getElementById('loginSpinner');
        const loginBtnText = document.getElementById('loginBtnText');
        const loginError = document.getElementById('loginError');

        const registerModal = document.getElementById('registerModal');
        const closeRegisterModalBtn = document.getElementById('closeRegisterModal');
        const registerForm = document.getElementById('registerForm');
        const registerUsernameInput = document.getElementById('registerUsername');
        const registerEmailInput = document.getElementById('registerEmail');

        const registerConfirmPasswordInput = document.getElementById('registerConfirmPassword');
        const registerSubmitBtn = document.getElementById('registerSubmitBtn');

        async function checkLoginStatus() {
            try {
                const response = await fetch('/api/check-login', {
                    method: 'GET',
                    credentials: 'same-origin'
                });
                const data = await response.json();

                if (data.loggedIn) {
                    isLoggedIn = true;
                    currentUser = data.username;
                    currentPermissionLevel = determinePermissionLevel(data);
                    isAdmin = data.isAdmin || false;
                    currentPermissionExpiry = data.vipExpiryTime;
                    console.log('✅ 用户已登录:', currentUser);
                } else {
                    isLoggedIn = false;
                    currentUser = null;
                    isAdmin = false;
                    currentPermissionLevel = 'FREE';
                    currentPermissionExpiry = null;

                }

                renderDropdown();
                updateAdminFeedbackButton();
            } catch (error) {
                console.error('检查登录状态失败:', error);
                isLoggedIn = false;
                currentUser = null;
                currentPermissionLevel = 'FREE';
                currentPermissionExpiry = null;
                updateAvatarUI();
                renderDropdown();
            }
        }

        async function handleLogin(username, password) {
            loginSubmitBtn.disabled = true;
            loginSpinner.style.display = 'inline-block';
            loginBtnText.textContent = '登录中...';
            loginError.textContent = '';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    isLoggedIn = true;
                    currentUser = data.username;
                    isAdmin = data.isAdmin || false;
                    currentPermissionLevel = determinePermissionLevel(data);
                    currentPermissionExpiry = data.vipExpiryTime;

                    updateAvatarUI();
                    renderDropdown();
                    updateAdminFeedbackButton();
                    closeLoginModal();
                    showTemporaryMessage(`登录成功！欢迎 ${data.username}`);

                    loadGamesFromDatabase();
                } else {
                    loginError.textContent = data.message || '登录失败';
                }

            } catch (error) {
                console.error('登录错误:', error);
                loginError.textContent = '网络错误，请稍后重试';
            } finally {
                loginSubmitBtn.disabled = false;
                loginSpinner.style.display = 'none';
                loginBtnText.textContent = '登录';
            }
        }

        async function handleLogout() {
            try {
                const response = await fetch('/api/logout', {
                    method: 'POST',
                    credentials: 'same-origin'
                });

                if (response.ok) {
                    isLoggedIn = false;
                    currentUser = null;
                    isAdmin = false;
                    currentPermissionLevel = 'FREE';
                    currentPermissionExpiry = null;
                    updateAvatarUI();
                    renderDropdown();
                    updateAdminFeedbackButton();
                    showTemporaryMessage('已退出登录');
                }
            } catch (error) {
                console.error('登出错误:', error);
            }
        }

        async function handleRegister(username, email, password, confirmPassword) {
            if (password !== confirmPassword) {
                registerError.textContent = '两次输入的密码不一致';
                return;
            }

            if (password.length < 6) {
                registerError.textContent = '密码长度至少为6位';
                return;
            }

            registerSubmitBtn.disabled = true;
            registerSpinner.style.display = 'inline-block';
            registerBtnText.textContent = '注册中...';
            registerError.textContent = '';
            registerSuccess.textContent = '';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        username: username.trim(),
                        email: email ? email.trim() : null,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    isLoggedIn = true;
                    currentUser = data.username;
                    currentPermissionLevel = data.permissionLevel || 'FREE';
                    currentPermissionExpiry = data.permissionExpiryTime;

                    updateAvatarUI();
                    renderDropdown();
                    closeRegisterModal();
                    showTemporaryMessage(`注册成功！欢迎 ${data.username}`);
                } else {
                    registerError.textContent = data.message || '注册失败';
                }

            } catch (error) {
                console.error('注册错误:', error);
                registerError.textContent = '网络错误，请稍后重试';
            } finally {
                registerSubmitBtn.disabled = false;
                registerSpinner.style.display = 'none';
                registerBtnText.textContent = '注册';
            }
        }

        function determinePermissionLevel(data) {
            if (data.isAdmin) {
                return 'LIFETIME';
            }

            if (!data.isVip) {
                return 'FREE';
            }

            const vipStatus = data.vipStatus || '';
            if (vipStatus.includes('终身') || vipStatus.includes('永久')) {
                return 'LIFETIME';
            }

            const expiryTime = data.vipExpiryTime;
            if (!expiryTime || expiryTime === '永久') {
                return 'LIFETIME';
            }

            const now = new Date();
            const expiry = new Date(expiryTime);
            const diffMonths = (expiry.getFullYear() - now.getFullYear()) * 12 + (expiry.getMonth() - now.getMonth());

            if (diffMonths >= 12) {
                return 'YEARLY';
            } else if (diffMonths >= 3) {
                return 'QUARTERLY';
            } else if (diffMonths >= 1) {
                return 'MONTHLY';
            } else {
                return 'FREE';
            }
        }

            });
        }

        function toggleDropdown(show) {
            if (show === undefined) {
                dropdown.classList.toggle('show');
            } else {
                dropdown.classList.toggle('show', show);
            }
        }
        function closeDropdown() {
            dropdown.classList.remove('show');
        }

        avatarBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDropdown();
        });

        document.addEventListener('click', (e) => {
            if (!avatarWrapper.contains(e.target)) {
                closeDropdown();
            }
        });

        function openLoginModal() {
            loginModal.classList.add('show');
            overlay.classList.add('show');
            loginUsernameInput.value = '';
            loginPasswordInput.value = '';
            loginError.textContent = '';
            setTimeout(() => loginUsernameInput.focus(), 100);
        }

        function closeLoginModal() {
            loginModal.classList.remove('show');
            overlay.classList.remove('show');
            loginForm.reset();
            loginError.textContent = '';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = loginUsernameInput.value.trim();
            const password = loginPasswordInput.value;

            if (!username || !password) {
                loginError.textContent = '请输入用户名和密码';
                return;
            }

            await handleLogin(username, password);
        });

        closeLoginModalBtn.addEventListener('click', closeLoginModal);

        function openRegisterModal() {
            registerModal.classList.add('show');
            overlay.classList.add('show');
            registerUsernameInput.value = '';
            registerEmailInput.value = '';
            registerPasswordInput.value = '';
            registerConfirmPasswordInput.value = '';
            registerError.textContent = '';
            registerSuccess.textContent = '';
            setTimeout(() => registerUsernameInput.focus(), 100);
        }

        function closeRegisterModal() {
            registerModal.classList.remove('show');
            overlay.classList.remove('show');
            registerForm.reset();
            registerError.textContent = '';
            registerSuccess.textContent = '';
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = registerUsernameInput.value.trim();
            const email = registerEmailInput.value.trim();
            const password = registerPasswordInput.value;
            const confirmPassword = registerConfirmPasswordInput.value;

            if (!username || !password || !confirmPassword) {
                registerError.textContent = '请填写必填字段';
                return;
            }

            await handleRegister(username, email, password, confirmPassword);
        });

        closeRegisterModalBtn.addEventListener('click', closeRegisterModal);

        function openHistoryPanel() {
            renderHistoryList();
            historyPanel.classList.add('open');
            overlay.classList.add('show');
        }
        function closeHistoryPanel() {
            historyPanel.classList.remove('open');
            overlay.classList.remove('show');
        }

        function addHistory(gameName) {
            if (!gameName) return;
            const record = {
                gameName: gameName,
                timestamp: new Date().toLocaleTimeString('zh', { hour12: false, hour: '2-digit', minute: '2-digit', second:'2-digit' })
            };
            historyRecords.unshift(record);
            if (historyRecords.length > MAX_HISTORY) historyRecords.pop();
            if (historyPanel.classList.contains('open')) {
                renderHistoryList();
            }
        }

        function renderHistoryList() {
            if (historyRecords.length === 0) {
                historyContainer.innerHTML = '<div style="padding: 24px; text-align: center; color: #7f95b0;"><i class="fas fa-gamepad" style="font-size: 2rem; opacity: 0.5; margin-bottom: 10px;"></i><br />暂无浏览记录，点击游戏卡片吧</div>';
                return;
            }
            let itemsHtml = '';
            historyRecords.forEach(rec => {
                itemsHtml += `
                    <div class="history-item">
                        <div class="history-icon"><i class="fas fa-gamepad"></i></div>
                        <div class="history-detail">
                            <div class="history-game">${rec.gameName}</div>
                            <div class="history-time">${rec.timestamp}</div>
                        </div>
                    </div>
                `;
            });
            historyContainer.innerHTML = itemsHtml;
        }

        function clearHistory() {
            historyRecords = [];
            renderHistoryList();
        }

        function showTemporaryMessage(msg) {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.position = 'fixed';
            toast.style.bottom = '30px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.background = '#1e293b';
            toast.style.color = '#f1f5f9';
            toast.style.padding = '12px 24px';
            toast.style.borderRadius = '60px';
            toast.style.boxShadow = '0 12px 20px #00000050';
            toast.style.zIndex = '9999';
            toast.style.border = '1px solid #7c3aed';
            toast.style.fontWeight = '500';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        closeHistoryBtn.addEventListener('click', closeHistoryPanel);
        overlay.addEventListener('click', () => {
            closeHistoryPanel();
            closeDropdown();
            closeLoginModal();
            closeRegisterModal();
        });
        clearHistoryBtn.addEventListener('click', clearHistory);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (historyPanel.classList.contains('open')) closeHistoryPanel();
                closeDropdown();
                closeLoginModal();
                closeRegisterModal();
            }
        });

        discoverBtn.addEventListener('click', () => {
            document.querySelector('.game-grid').scrollIntoView({ behavior: 'smooth' });
        });

        updateAvatarUI();
        renderDropdown();
        checkLoginStatus();

        window.demoAddHistory = addHistory;
    })();
</script>


</body>
</html>

spring.application.name=Game

# MySQL数据库连接配置（添加 allowPublicKeyRetrieval=true）
spring.datasource.url=jdbc:mysql://localhost:3306/Game?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# 方言改为 MySQLDialect（MySQL8Dialect 在 Hibernate 7 中已不存在）
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis配置
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# Spring Session 配置
spring.session.store-type=redis
spring.session.redis.namespace=spring:session
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# 日志配置 - 登录日志单独输出到文件
logging.level.game.demo.controller.LoginController=INFO
logging.file.name=logs/app.log
logging.file.path=logs

# Spring Session 调试日志
logging.level.org.springframework.session=DEBUG
logging.level.org.springframework.data.redis=DEBUG


# 登录日志专门输出到 login.log 文件
logging.level.game.demo=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
